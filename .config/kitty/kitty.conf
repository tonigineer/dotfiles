# ── kitty ───────────────────────────────────────────────────────────────
#
# Only the settings that actually differ from kitty's defaults. This file
# used to carry kitty's stock commented reference dump (2527 lines, 42 of
# them live); that reference lives at https://sw.kovidgoyal.net/kitty/conf/
# and `kitty +runpy 'from kitty.config import load_config'` parses whatever
# is here, so there is no reason to vendor 2485 lines of it.
#
# Colours come from the two includes at the bottom. Both are generated and
# gitignored: themes/caelestia.conf is a link into ~/.local/state/caelestia,
# themes/noctalia.conf is rewritten by Noctalia on every palette change.
# Later includes win, so Noctalia has the final say on colours.

# ── Fonts ───────────────────────────────────────────────────────────────

font_family      Monaspace Krypton
bold_font        Monaspace Krypton
italic_font      Monaspace Krypton
bold_italic_font Monaspace Krypton
font_size 12

# ── Cursor ──────────────────────────────────────────────────────────────

cursor_blink_interval 1.0
cursor_stop_blinking_after -1

# ── Scrollback ──────────────────────────────────────────────────────────

scrollback_lines 2000

# Deprecated as of kitty 0.48 ("use scrollbar instead") and it warns on every
# start. Kept because dropping it would change the indicator's appearance.
scrollback_indicator_opacity 0.5

# ── Selection and clipboard ─────────────────────────────────────────────

# a1 is a private buffer, NOT the clipboard. The binding that reads it back
# (`map ctrl+v paste_from_buffer a1`, in the Keys section) is shadowed by a
# later paste_from_clipboard mapping, so selections land in a1 and nothing
# pastes them. Set this to `yes` if selections should reach the clipboard.
copy_on_select a1

strip_trailing_spaces never

# ── Hyperlinks ──────────────────────────────────────────────────────────

show_hyperlink_targets yes
underline_hyperlinks hover
allow_hyperlinks yes

# ── Window ──────────────────────────────────────────────────────────────

remember_window_size yes
initial_window_width 640
initial_window_height 400
window_border_width 0.5pt
window_padding_width 5
hide_window_decorations yes
resize_in_steps no
confirm_os_window_close 0
background_opacity 1.0
sync_to_monitor yes
enable_audio_bell no

# ── Shell and integration ───────────────────────────────────────────────

shell zsh
term xterm-kitty
shell_integration enabled
allow_remote_control yes

# ── Keys ────────────────────────────────────────────────────────────────

map ctrl+c copy_or_interrupt

# Both ctrl+v mappings are kept, in their original order. kitty keeps every
# mapping for a key rather than discarding shadowed ones, so removing the
# first would leave a different keymap than the old file produced. The later
# mapping is the one that fires; delete the paste_from_buffer line once you
# have decided you want the clipboard rather than the a1 buffer.
map ctrl+v paste_from_buffer a1
map ctrl+v paste_from_clipboard
map ctrl+equal change_font_size all +2.0
map ctrl+minus change_font_size all -2.0
map kitty_mod+f5 load_config_file

# ── Generated colour schemes (gitignored) ───────────────────────────────

include themes/caelestia.conf
include themes/noctalia.conf
