# Reference: https://sw.kovidgoyal.net/kitty/conf/

# ── Fonts ───────────────────────────────────────────────────────────────

font_family      Monaspace Krypton
bold_font        Monaspace Krypton
italic_font      Monaspace Krypton
bold_italic_font Monaspace Krypton
font_size 12

# ── Cursor ──────────────────────────────────────────────────────────────

cursor_blink_interval 1.0
cursor_stop_blinking_after -1

# ── Scrollback ──────────────────────────────────────────────────────────

scrollback_lines 2000

# Deprecated since kitty 0.48 (warns on start), kept for the indicator's look.
scrollback_indicator_opacity 0.5

# ── Selection and clipboard ─────────────────────────────────────────────

# a1 is a private buffer, not the clipboard; use `yes` to copy selections there.
copy_on_select a1

strip_trailing_spaces never

# ── Hyperlinks ──────────────────────────────────────────────────────────

show_hyperlink_targets yes
underline_hyperlinks hover
allow_hyperlinks yes

# ── Window ──────────────────────────────────────────────────────────────

remember_window_size no
initial_window_width 640
initial_window_height 400
window_border_width 0.5pt
window_padding_width 5
hide_window_decorations yes
resize_in_steps no
confirm_os_window_close 0
background_opacity 1.0
# Lets a config reload change the opacity of open windows.
dynamic_background_opacity yes
sync_to_monitor yes
enable_audio_bell no

# ── Shell and integration ───────────────────────────────────────────────

shell zsh
term xterm-kitty
shell_integration enabled
allow_remote_control yes

# ── Keys ────────────────────────────────────────────────────────────────

map ctrl+c copy_or_interrupt

# The later ctrl+v mapping wins; paste_from_buffer a1 is shadowed.
map ctrl+v paste_from_buffer a1
map ctrl+v paste_from_clipboard
map ctrl+equal change_font_size all +2.0
map ctrl+minus change_font_size all -2.0
map kitty_mod+f5 load_config_file

# ── Generated colour schemes ────────────────────────────────────────────
# Later includes win, so Noctalia has the final say.

include themes/caelestia.conf

# ── Desktop profile (SUPER+F6) ──────────────────────────────────────────
# kitty skips a missing include.

include ${HOME}/.local/state/desktop-profile/kitty.conf
include themes/noctalia.conf
