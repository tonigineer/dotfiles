# ── kitty — elegant desktop profile ─────────────────────────────────────
#
# Swapped in by .local/bin/desktop-profile (SUPER+F6), which links this file to
# ~/.local/state/desktop-profile/kitty.conf; kitty.conf includes that path last.
# The same glass as the Noctalia bar: its colour (the palette's surface, not
# the terminal background) at its 70% (background_opacity in
# .config/noctalia/profiles/elegant.toml), frosted by the same Hyprland blur.
# Only the background is see-through; text stays fully opaque.
#
# Hex, because kitty cannot name a palette role: Rosé Pine Dawn's surface,
# matching elegant_palette in .local/bin/desktop-profile.

background #fffaf3
background_opacity 0.7
