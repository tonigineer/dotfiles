# ── Noctalia — elegant desktop profile ──────────────────────────────────
# settings.toml wins on any key it also sets, so this only touches keys it
# leaves alone: bar.default is disabled rather than restyled.

[shell.screen_corners]
enabled = true
size    = 18

[bar.default]
enabled = false

[bar.elegant]
position             = "top"
thickness            = 34
margin_edge          = 0         # attached to the edge
margin_ends          = 520       # (1920 logical px - ~880 notch) / 2, both monitors
concave_edge_corners = true      # upper corners flare into the screen edge
radius               = 18        # flare and lower corners, same as the screen corners
padding              = 16
widget_spacing       = 12
background_opacity   = 0.7       # keep above the layer rule's ignore_alpha (0.5) to get blur
compositor_blur      = true
shadow               = false
border_width         = 0.0
capsule              = false

start  = [ "control-center", "e_workspaces" ]
center = [ "e_clock", "e_date" ]
end    = [ "tray", "volume", "bluetooth", "network", "notifications", "session" ]

# ── Widgets used only by this bar ───────────────────────────────────────
# Own ids, so the normal bar's widgets stay untouched.

[widget.e_workspaces]
type           = "workspaces"
style          = "focus_hint"
focused_color  = "primary"
occupied_color = "on_surface_variant"
empty_color    = "outline"

[widget.e_media]
type               = "media"
hide_when_no_media = true
max_length         = 260
title_scroll       = "on_hover"

[widget.e_clock]
type           = "clock"
format         = "{:%H:%M}"
tooltip_format = "{:%A, %d. %B %Y}"
color          = "on_surface"
font_weight    = 600

[widget.e_date]
type   = "clock"
format = "{:%a %d. %b}"
color  = "on_surface_variant"

# Without "glass" the cards inside panels stay solid.
[shell.panel]
transparency_mode = "glass"

[notification]
background_opacity = 0.7

[osd]
background_opacity = 0.7
