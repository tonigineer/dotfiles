# ── /etc/systemd/system/ollama.service.d/override.conf ──────────────────
#
# Copied here by 056-ollama.sh. Ollama's packaged unit is not owned by
# pacman (this box runs the upstream install.sh into /usr/local), so this is
# a drop-in rather than a replacement: systemd merges it over the shipped
# unit and the base ExecStart/User/PATH are left alone.
#
# Why any of this is needed: OLLAMA_CONTEXT_LENGTH defaults to "4k/32k/256k
# based on VRAM", and on a 24 GB card that resolves to 32768. That is fine
# for chat and far too small for an agent — Claude Code's system prompt plus
# its tool definitions measure ~25k tokens before the conversation starts,
# so a 32k window leaves ~7k of usable room. Worse, llama-server runs with
# --context-shift, so overflowing does not raise an error: it silently
# evicts the oldest tokens, which are exactly the system prompt and the tool
# schemas. The model then "works" but has forgotten what tools it has.
#
# Sizing the window is a VRAM question, and qwen3.8's architecture makes it
# a much cheaper one than the 27.3B parameter count suggests. The model is
# hybrid: 64 layers laid out as 16 × (3 × Gated DeltaNet → 1 × Gated
# Attention). The DeltaNet layers are linear-attention and carry a
# fixed-size recurrent state, so they contribute nothing that grows with
# sequence length. Only the 16 full-attention layers hold a KV cache, and
# those are GQA with 4 KV heads at head_dim 256. Per token that is
#
#     16 layers × 4 heads × 256 dim × 2 (K and V) × bytes-per-element
#
# which comes to 64.0 KB/token at f16, 33.9 KB at q8_0 and 17.9 KB at q4_0.
# Against a budget of roughly 5 GB — 24.5 GB card, less ~16.9 GB of Q4_K_M
# weights, less ~2.4 GB the compositor holds — that gives:
#
#            64k       128k      256k
#     f16    4.29 GB   8.59 GB   17.18 GB
#     q8_0   2.28 GB   4.55 GB    9.11 GB
#     q4_0   1.20 GB   2.41 GB    4.81 GB
#
# Those are cache figures only, and the arithmetic turned out to be the
# optimistic half of the story: llama.cpp's compute buffers and Ollama's own
# conservative reservation both come out of the same 5 GB. What the card
# actually does, measured by loading at each size and reading `ollama ps`:
#
#     q4_0   131072   11%/89% CPU/GPU
#            114688    9%/91%
#             98304    6%/94%
#             81920    100% GPU
#
# So 81920 is the largest window that stays entirely resident, and it is the
# value set below. It beats the 65536/q8_0 pairing this file used to carry on
# both axes at once — a quarter more context, and it drops the 9% CPU spill
# that configuration had settled for. After Claude Code's ~25k of system
# prompt and tool schemas that leaves ~57k of working room, against ~40k
# before.
#
# The cost is precision, not memory: a 4-bit KV cache degrades long-context
# recall, which is the thing a long context is for. The bet is that an agent
# loop re-reads its context far more than it depends on exact recall of a
# token 70k back. If long-range retrieval starts looking unreliable, go back
# to q8_0 — and drop the window with it, to about 40960, since q8_0 needs
# 33.9 KB/token and 65536 was already spilling.
#
# 131072 is reachable if the 11% spill is worth it; nothing above that is.
# Re-measure with `ollama ps` after any change here, and note that the
# numbers move if anything else takes VRAM — the ~2.4 GB assumed for the
# compositor is not a constant.
#
# OLLAMA_FLASH_ATTENTION is set explicitly because the K/V quantisation
# depends on it; recent Ollama negotiates flash attention on its own
# (--flash-attn auto), but the pairing is what matters here, so it is stated
# rather than assumed.
#
# OLLAMA_MODELS moves the blob store off the root filesystem. Upstream's
# install.sh puts it at /usr/share/ollama/.ollama/models, which lands on /
# — a 1.3 TB volume already at 93% use, and the store is not small: a
# single 4-bit quant of a current large MoE runs 70–110 GB, more than the
# free space there. /data is a second NVMe (nvme1n1p1, ext4, 916 GB with
# ~800 GB free) mounted from fstab, so it is present before the unit starts
# — unlike a removable or late-mounted path, which would have the daemon
# come up and silently recreate an empty store.
#
# The directory has to be owned by the `ollama` user the unit runs as. If it
# is not, the daemon still starts and `ollama list` still answers; every
# pull is what fails, with a permission error against the blobs directory.

[Service]
Environment="OLLAMA_CONTEXT_LENGTH=81920"
Environment="OLLAMA_FLASH_ATTENTION=1"
Environment="OLLAMA_KV_CACHE_TYPE=q4_0"
Environment="OLLAMA_MODELS=/data/ollama/models"
