config_version = 2

[bar.default]
border = "on_surface"
center = [ "clipboard", "notifications", "workspaces", "caffeine" ]
end = [
    "network_rx",
    "network_tx",
    "_active_ws",
    "tray",
    "volume",
    "bluetooth",
    "network",
    "_active_ws",
    "date",
    "_active_ws",
    "screen_recorder",
    "session"
]
margin_edge = 0.0
margin_ends = 0.0
padding = 10
radius = 0
radius_bottom_left = 5
radius_bottom_right = 5
start = [ "control-center", "_active_ws", "cpu", "ram", "sysmon", "_active_ws", "active_window" ]
thickness = 25
widget_spacing = 10

[desktop_widgets]
enabled = false

[keybinds]
down = [ "Ctrl+n" ]
up = [ "Ctrl+p" ]

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-3", "lockscreen-login-box@DP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 960.0
    cy = 961.0
    output = "DP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_password_hint = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-3"]
    box_height = 70.0
    box_width = 400.0
    cx = 960.0
    cy = 961.0
    output = "DP-3"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-3".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_password_hint = true

[shell]
avatar_path = "/home/toni/.face"
corner_radius_scale = 0.5000000074505806
font_family = "Monaspace Krypton"
lang = "en"
password_style = "random"
settings_show_advanced = true
ui_scale = 1.1500000096857548

    [shell.panel]
    launcher_categories = false
    launcher_placement = "attached"
    open_near_click_launcher = true
    session_placement = "centered"

    [[shell.session.actions]]
    action = "lock"
    command = "/home/toni/.local/share/quickshell-lockscreen/lock.sh"
    enabled = true
    shortcut = "l"
    variant = "outline"

    [[shell.session.actions]]
    action = "logout"
    enabled = true
    shortcut = "o"
    variant = "default"

    [[shell.session.actions]]
    action = "suspend"
    enabled = true
    shortcut = "s"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    enabled = true
    shortcut = "r"
    variant = "destructive"

    [[shell.session.actions]]
    action = "shutdown"
    enabled = true
    shortcut = "k"
    variant = "destructive"

[system.monitor]
network_poll_seconds = 1

[theme]
community_palette = "Breeze"
source = "wallpaper"
wallpaper_scheme = "muted"

    [theme.templates]
    builtin_ids = [ "btop", "cava", "gtk3", "gtk4", "hyprland", "kitty", "qt" ]
    community_ids = [ "spicetify", "zen-browser", "neovim", "vscode", "zed", "discord", "lazygit", "yazi" ]

[wallpaper]
directory = "/home/toni/Wallpaper"
fill_mode = "fit"
transition_on_startup = true

    [wallpaper.automation]
    order = "alphabetical"

    [wallpaper.default]
    path = "/home/toni/Wallpaper/unix-cloud.jpg"

    [wallpaper.last]
    path = "/home/toni/Wallpaper/unix-cloud.jpg"

    [wallpaper.monitors.DP-1]
    path = "/home/toni/Wallpaper/unix-cloud.jpg"

    [wallpaper.monitors.DP-3]
    path = "/home/toni/Wallpaper/unix-cloud.jpg"

[weather]
address = "Markdorf"

[widget._active_ws]
scale = 1.1000000000000001
type = "spacer"

[widget.active_window]
color = "primary"
title_scroll = "always"

[widget.control-center]
glyph = "bottle-filled"

[widget.cpu]
show_label = false

[widget.date]
color = "primary"
format = "{:%H:%M %a, %d. %b}"
tooltip_format = "{:%H:%M %a, %d. %b}"

[widget.network]
show_label = false

[widget.network_rx]
display = "graph"
show_label = false

[widget.network_tx]
display = "graph"
show_label = false

[widget.ram]
show_label = false

[widget.screen_recorder]
copy_to_clipboard = true
frame_rate = 144
hide_inactive = true
script = "scripts/screen_recorder.lua"
type = "scripted"

[widget.session]
color = "error"

[widget.sysmon]
path = "/home"
show_label = false
stat = "disk_pct"

[widget.temp]
show_label = false

[widget.tray]
match_adjacent_spacing = true

[widget.volume]
show_label = false

[widget.workspaces]
display = "name"